name: 허브 서버 신고 (치트·비매너)
description: 허브 서버(공개 집회소)에서 치트, 방해, 비매너를 겪었을 때
title: "[신고] "
labels: ["report"]
body:
  - type: markdown
    attributes:
      value: |
        신고는 운영자가 허브 서버의 입장 기록(최근 3일)에서 찾아 확인한 뒤 **강퇴·밴**으로 처리합니다. 3일이 지나면 기록이 지워져 찾을 수 없으니 되도록 빨리 남겨 주세요.
        **이 게시판은 누구나 볼 수 있습니다.** 상대의 헌터 이름 말고 다른 개인정보(IP, 실명, 연락처, 다른 사이트 아이디)는 쓰지 마세요. 욕설이나 공개 저격은 지웁니다.
        처리 결과(밴 여부, 기간)는 여기에 공개하지 않을 수 있습니다.
  - type: input
    id: name
    attributes:
      label: 상대의 헌터 이름
      description: 게임 속 이름 그대로 (0.10.15부터 서버에 헌터 이름이 남습니다)
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: 언제였나요?
      description: 날짜와 대략의 시각 (한국 시간)
      placeholder: "예: 11월 26일 밤 10시쯤"
    validations:
      required: true
  - type: dropdown
    id: room
    attributes:
      label: 방 종류
      options:
        - 공개방
        - 키 방 (매칭 키)
        - 모르겠음
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 무슨 일이었나요?
      options:
        - 치트·해킹 (말이 안 되는 대미지, 순간 이동, 아이템 등)
        - 퀘스트 방해 (일부러 수레, 방치 등)
        - 비매너 채팅·이름
        - 기타
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 자세히
      description: 무엇을 봤는지. 스크린샷이나 영상이 있으면 이 칸에 끌어다 놓으세요 (다른 사람의 길드 카드 등 개인정보는 가려 주세요).
    validations:
      required: true
  - type: input
    id: me
    attributes:
      label: 내 헌터 이름 (선택)
      description: 같은 방에 있었는지 기록에서 맞춰 보는 데 씁니다
    validations:
      required: false
