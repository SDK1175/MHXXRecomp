<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MHXX 허브 관리</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f1f3f6; --line: #e3e6eb; --hover: #f3f5f8;
  --text: #1d2129; --muted: #5d6675; --dim: #8a93a3;
  --accent: #2f6fde; --accent-soft: rgba(47,111,222,.10);
  --ok: #1f9d55; --warn: #c27c0e; --bad: #d64545; --udp: #2f6fde; --lan: #7b55d6;
  --r: 10px; --ease: cubic-bezier(.2, .8, .2, 1);
  font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111317; --panel: #191c21; --panel-2: #20242a; --line: #2b3038; --hover: #22262d;
    --text: #e8eaee; --muted: #a0a7b3; --dim: #6c7380;
    --accent: #5b9bff; --accent-soft: rgba(91,155,255,.14);
    --ok: #4cc685; --warn: #e2a33a; --bad: #f06a6a; --udp: #5b9bff; --lan: #a58bff;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: .92em; }

/* header */
header {
  position: sticky; top: 0; z-index: 10; padding: 14px 20px 0;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 17px; }
.brand small { color: var(--muted); font-weight: 600; font-size: 12px; margin-left: 6px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
  padding: 4px 10px; border-radius: 99px; background: var(--panel-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.live.on .dot { background: var(--ok); animation: pulse 1.8s infinite; }
.live.off .dot { background: var(--bad); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(95,208,138,.6); } 70% { box-shadow: 0 0 0 8px rgba(95,208,138,0); } 100% { box-shadow: 0 0 0 0 rgba(95,208,138,0); } }
.chips { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.chip { font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 8px; background: var(--panel-2); }
.chip b { color: var(--text); font-size: 13px; margin-left: 4px; transition: color .3s; }
.chip b.bump { color: var(--accent); }
nav { display: flex; gap: 4px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
nav button {
  background: none; border: 0; padding: 10px 14px; color: var(--muted); font-weight: 700; font-size: 14px;
  border-bottom: 2px solid transparent; transition: color .2s, border-color .2s; white-space: nowrap;
}
nav button:hover { color: var(--text); }
nav button.on { color: var(--text); border-color: var(--accent); }
.offbar { display: none; background: var(--bad); color: #fff; text-align: center; font-size: 13px; padding: 6px; }
.offbar.show { display: block; animation: drop .3s var(--ease); }
@keyframes drop { from { transform: translateY(-100%); opacity: 0; } }

main { padding: 18px 20px 40px; max-width: 1280px; margin: 0 auto; }
.view { display: none; animation: fade .25s var(--ease); }
.view.on { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } }

/* rooms */
.split { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 18px; align-items: start; }
.list { display: flex; flex-direction: column; gap: 10px; }
.empty { color: var(--dim); text-align: center; padding: 48px 12px; border: 1px dashed var(--line); border-radius: var(--r); }
.card {
  position: relative; text-align: left; width: 100%; padding: 14px 16px; border-radius: var(--r);
  background: var(--panel); border: 1px solid var(--line);
  transition: transform .2s var(--ease), border-color .2s, background .2s, opacity .3s, max-height .35s var(--ease), margin .35s, padding .35s;
  animation: enter .35s var(--ease); max-height: 200px; overflow: hidden;
}
.card:hover { background: var(--hover); }
.card.sel { border-color: var(--accent); background: var(--accent-soft); }
.card.leave { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; margin-top: -10px; border-width: 0; }
@keyframes enter { from { opacity: 0; transform: translateY(8px) scale(.98); } }
.card .row1 { display: flex; align-items: center; gap: 8px; }
.card .name { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; opacity: .9; }
.b-open { color: var(--ok); }
.b-key { color: var(--warn); }
.b-host { color: var(--text); }
.b-udp, .b-tcp { color: var(--udp); }
.b-lan { color: var(--lan); }
.b-joining { color: var(--muted); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .45; } }
.meta { display: flex; align-items: center; gap: 10px; margin-top: 10px; color: var(--muted); font-size: 12px; }
.bar { flex: 1; height: 4px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .45s var(--ease); }
.count { font-weight: 800; color: var(--text); font-size: 13px; }

/* detail */
.detail { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-height: 260px; position: sticky; top: 130px; }
.detail h2 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
.detail .sub { color: var(--muted); font-size: 12px; margin-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; }
.back { display: none; background: none; border: 0; color: var(--accent); font-weight: 700; padding: 0 0 12px; }
.members { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.member {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center;
  padding: 12px; border-radius: 10px; background: var(--panel-2);
  animation: enter .3s var(--ease); transition: opacity .3s, transform .3s;
}
.member.leave { opacity: 0; transform: translateX(12px); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: var(--accent);
  background: var(--accent-soft); }
.member .who { min-width: 0; }
.member .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member .who span { color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 3px; }
.ip { color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; transition: background .2s; }
.ip:hover { background: var(--accent-soft); }
.actions { display: flex; gap: 6px; }
.btn { border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; border: 1px solid var(--line); background: var(--panel); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.danger { color: var(--bad); }
.hint { color: var(--dim); font-size: 12px; margin-top: 14px; }
.placeholder { color: var(--muted); padding: 40px 20px; text-align: center; background: var(--panel); border-radius: var(--r); border: 1px dashed var(--line); }

/* lists (bans, records) */
.rows { display: flex; flex-direction: column; gap: 8px; }
.rowc { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--r);
  background: var(--panel); border: 1px solid var(--line); animation: enter .3s var(--ease); transition: opacity .3s, transform .3s; }
.rowc.leave { opacity: 0; transform: translateX(12px); }
.rowc b { font-weight: 700; }
.rowc .m { color: var(--muted); font-size: 12px; margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.toolbar input { flex: 1; min-width: 200px; }
input, select, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
h3 { font-size: 14px; color: var(--muted); margin: 22px 0 10px; font-weight: 700; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.solid-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:not(:disabled):hover { filter: brightness(1.08); }

/* dialog */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: grid; place-items: center; z-index: 60; padding: 16px;
  animation: fade .2s var(--ease); }
.dialog { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,.3); animation: pop .22s var(--ease); }
@keyframes pop { from { opacity: 0; transform: scale(.96) translateY(6px); } }
.dialog h4 { margin: 0 0 6px; font-size: 17px; }
.dialog p { margin: 0 0 14px; color: var(--muted); font-size: 13px; line-height: 1.5; }
.dialog label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
.dialog textarea { width: 100%; min-height: 70px; resize: vertical; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 700; font-size: 13px; }
.seg button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.dialog .foot .btn { padding: 8px 14px; font-size: 13px; }

/* server tab */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.stat .k { color: var(--muted); font-size: 12px; }
.stat .v { font-size: 22px; font-weight: 800; margin-top: 6px; }

/* toasts */
.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: min(360px, calc(100vw - 32px)); }
.toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 13px;
  box-shadow: 0 6px 20px rgba(0,0,0,.18);
  animation: toastIn .3s var(--ease); transition: opacity .3s, transform .3s; }
.toast.out { opacity: 0; transform: translateX(16px); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } }

/* phones: list, then the room over it */
@media (max-width: 860px) {
  header { padding: 12px 14px 0; }
  main { padding: 14px 14px 32px; }
  .chips { margin-left: 0; width: 100%; }
  .split { grid-template-columns: 1fr; }
  .detail { position: fixed; inset: 0; z-index: 20; border-radius: 0; top: 0; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top)) 16px 24px;
    background: var(--bg); transform: translateX(100%); transition: transform .3s var(--ease); }
  .detail.open { transform: none; }
  .back { display: block; }
  .member { grid-template-columns: 34px 1fr; }
  .actions { grid-column: 1 / -1; justify-content: flex-end; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">MHXX 허브 관리<small id="ver"></small></div>
    <div class="live" id="live"><span class="dot"></span><span id="liveText">연결 중</span></div>
    <div class="chips">
      <div class="chip">방<b id="cRooms">0</b></div>
      <div class="chip">중계 중<b id="cLinks">0</b></div>
      <div class="chip">연결<b id="cConns">0</b></div>
      <div class="chip">가동<b id="cUp">-</b></div>
    </div>
  </div>
  <nav id="tabs">
    <button data-v="rooms" class="on">방</button>
    <button data-v="bans">밴 목록</button>
    <button data-v="log">기록</button>
    <button data-v="server">서버 상태</button>
  </nav>
</header>
<div class="offbar" id="offbar">서버와 연결이 끊겼습니다. 다시 연결하는 중…</div>

<main>
  <section class="view on" id="v-rooms">
    <div class="split">
      <div class="list" id="rooms"></div>
      <div class="detail" id="detail"></div>
    </div>
  </section>
  <section class="view" id="v-bans"><div class="rows" id="bans"></div></section>
  <section class="view" id="v-log">
    <div class="toolbar"><input id="q" type="search" placeholder="닉네임이나 IP로 찾기 (최근 3일)" autocomplete="off"></div>
    <div class="rows" id="joins"></div>
    <h3>관리 조치 기록</h3>
    <div class="rows" id="actions"></div>
  </section>
  <section class="view" id="v-server">
    <div class="grid" id="stats"></div>
    <p class="hint">CPU·메모리·이번 달 트래픽은 3단계에서 추가됩니다.</p>
  </section>
</main>
<div class="toasts" id="toasts"></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const linkLabel = { host: "방장", udp: "UDP 중계", tcp: "TCP 중계", lan: "LAN·직접", joining: "입장 중" };
let state = null, prev = null, selected = null, skew = 0;

function ago(t) {
  const s = Math.max(0, Math.round((Date.now() + skew - new Date(t).getTime()) / 1000));
  if (s < 60) return "방금";
  if (s < 3600) return Math.floor(s / 60) + "분";
  if (s < 86400) return Math.floor(s / 3600) + "시간 " + Math.floor((s % 3600) / 60) + "분";
  return Math.floor(s / 86400) + "일 " + Math.floor((s % 86400) / 3600) + "시간";
}
function clock(t) { return new Date(t).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }); }
function hostName(r) { return (r.members[0] && r.members[0].name) || "(이름 없음)"; }

function toast(msg) {
  const box = $("#toasts");
  while (box.children.length >= 4) box.firstChild.remove();
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg; box.appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 320); }, 3600);
}

function setChip(id, v) {
  const el = $(id), s = String(v);
  if (el.textContent !== s) { el.textContent = s; el.classList.add("bump"); setTimeout(() => el.classList.remove("bump"), 500); }
}

// keyed list update: new items animate in, gone ones animate out, the rest are updated in place
function sync(container, items, key, make, update) {
  const have = new Map([...container.children].filter((e) => !e.classList.contains("leave") && e.dataset.k).map((e) => [e.dataset.k, e]));
  let last = null;
  for (const it of items) {
    const k = key(it);
    let el = have.get(k);
    if (el) { have.delete(k); update(el, it); }
    else { el = make(it); el.dataset.k = k; }
    const at = last ? last.nextSibling : container.firstChild;
    if (at !== el) container.insertBefore(el, at);
    last = el;
  }
  for (const el of have.values()) { el.classList.add("leave"); setTimeout(() => el.remove(), 360); }
}

function renderRooms() {
  const list = $("#rooms");
  const empty = list.querySelector(".empty");
  if (!state.rooms.length) { if (!empty) list.insertAdjacentHTML("afterbegin", '<div class="empty">지금 열린 방이 없습니다.</div>'); }
  else if (empty) empty.remove();
  sync(list, state.rooms, (r) => r.id, (r) => {
    const el = document.createElement("button");
    el.className = "card";
    el.onclick = () => select(r.id);
    fillCard(el, r); return el;
  }, fillCard);
  for (const el of list.querySelectorAll(".card")) el.classList.toggle("sel", el.dataset.k === selected);
}
function fillCard(el, r) {
  const pct = r.max ? Math.round((r.nodes / r.max) * 100) : 0;
  el.innerHTML = `<div class="row1"><span class="name">${esc(hostName(r))}</span>
      <span class="badge ${r.keyed ? "b-key" : "b-open"}">${r.keyed ? "매칭 키" : "공개"}</span></div>
    <div class="meta"><span class="count">${r.nodes}/${r.max}</span><div class="bar"><i style="width:${pct}%"></i></div>
      <span>${ago(r.opened)} 전</span></div>`;
}

function select(id) {
  selected = id;
  $("#detail").classList.add("open");
  renderRooms(); renderDetail(true);
}
function closeDetail() { selected = null; $("#detail").classList.remove("open"); renderRooms(); renderDetail(true); }

function renderDetail(full) {
  const d = $("#detail");
  const r = state && state.rooms.find((x) => x.id === selected);
  if (!r) {
    if (selected && prev) toast("보던 방이 닫혔습니다");
    selected = null; d.classList.remove("open");
    d.innerHTML = '<div class="empty" style="border:0">방을 고르면 들어와 있는 사람과 접속 주소가 보입니다.</div>';
    return;
  }
  if (full || !d.querySelector(".members")) {
    d.innerHTML = `<button class="back" id="back">← 방 목록</button>
      <h2><span id="dName"></span><span class="badge" id="dBadge"></span></h2>
      <div class="sub" id="dSub"></div><div class="members" id="members"></div>
      <div class="toolbar" style="margin-top:14px"><button class="btn danger" id="closeRoom">방 닫기</button>
      <span class="hint" style="margin:0">IP를 누르면 복사됩니다. LAN·직접으로 들어온 사람은 이 서버를 거치지 않아 막을 수 없습니다.</span></div>`;
    $("#back").onclick = closeDetail;
    $("#closeRoom").onclick = () => {
      const room = state.rooms.find((x) => x.id === selected); if (!room) return;
      confirmBox(`${hostName(room)}의 방을 닫을까요?`, "방장과 들어온 사람들의 연결이 끊깁니다. 밴은 아니라서 다시 열 수 있습니다.", "방 닫기",
        () => act("/api/close", { room: room.id, name: hostName(room) }, "방을 닫았습니다"));
    };
  }
  $("#dName").textContent = hostName(r);
  const b = $("#dBadge"); b.className = "badge " + (r.keyed ? "b-key" : "b-open"); b.textContent = r.keyed ? "매칭 키" : "공개";
  $("#dSub").innerHTML = `<span>인원 <b>${r.nodes}/${r.max}</b></span><span>열린 지 ${ago(r.opened)}</span><span class="mono">#${r.id.slice(0, 8)}</span><span class="mono">통신 규칙 0x${r.proto.toString(16)}</span>`;
  sync($("#members"), r.members, (m) => (m.node >= 0 ? "n" + m.node + ":" + m.name : "p" + m.pair), makeMember, fillMember);
}
function makeMember(m) { const el = document.createElement("div"); el.className = "member"; fillMember(el, m); return el; }
function fillMember(el, m) {
  const name = m.link === "joining" ? "(입장 중)" : m.name || "(이름 없음)";
  const ip = m.ip ? `<button class="ip mono" title="복사">${esc(m.ip)}</button>` : `<span>주소 없음 (이 서버를 거치지 않음)</span>`;
  const when = m.joined ? `<span>${clock(m.joined)} 입장 · ${ago(m.joined)} 전</span>` : "";
  el.innerHTML = `<div class="avatar">${esc((name.trim()[0] || "?").toUpperCase())}</div>
    <div class="who"><b>${esc(name)}</b><span><span class="badge b-${m.link}">${linkLabel[m.link] || esc(m.link)}</span>${ip}${when}</span></div>
    <div class="actions"><button class="btn" data-a="kick">${m.link === "host" ? "방 닫기" : "강퇴"}</button><button class="btn danger" data-a="ban">밴</button></div>`;
  const noIP = !m.ip;
  for (const b of el.querySelectorAll(".actions .btn")) { b.disabled = noIP; if (noIP) b.title = "이 서버를 거치지 않아 막을 수 없습니다"; }
  el.querySelector('[data-a="kick"]').onclick = () => kickMember(m);
  el.querySelector('[data-a="ban"]').onclick = () => banBox(m.ip, name);
  const ipb = el.querySelector(".ip");
  if (ipb) ipb.onclick = () => { navigator.clipboard?.writeText(m.ip).then(() => toast("IP 복사: " + m.ip), () => {}); };
}

// ---- actions
async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", credentials: "same-origin",
    headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error(r.status === 403 ? "권한이 없습니다 (앱으로 다시 열어 주세요)" : "서버 오류 " + r.status);
  return r.json();
}
async function act(path, body, done) {
  try {
    const r = await api(path, body);
    if (r.ok) toast(done + (r.closed ? ` (연결 ${r.closed}개 끊음)` : "")); else toast(r.message || "실패했습니다");
    if (logOpen()) loadLog();
  } catch (e) { toast(e.message); }
}
function dialog(html, bind) {
  const sc = document.createElement("div"); sc.className = "scrim";
  sc.innerHTML = `<div class="dialog" role="dialog">${html}</div>`;
  const close = () => { sc.remove(); document.removeEventListener("keydown", key); };
  const key = (e) => { if (e.key === "Escape") close(); };
  sc.onclick = (e) => { if (e.target === sc) close(); };
  document.addEventListener("keydown", key);
  document.body.appendChild(sc);
  bind(sc, close);
}
function confirmBox(title, text, okLabel, ok) {
  dialog(`<h4>${esc(title)}</h4><p>${esc(text)}</p><div class="foot"><button class="btn" data-x>취소</button><button class="btn solid-danger" data-ok>${esc(okLabel)}</button></div>`,
    (sc, close) => { sc.querySelector("[data-x]").onclick = close; sc.querySelector("[data-ok]").onclick = () => { close(); ok(); }; sc.querySelector("[data-ok]").focus(); });
}
function kickMember(m) {
  const room = state.rooms.find((x) => x.id === selected);
  if (m.link === "host") { $("#closeRoom")?.click(); return; }
  confirmBox(`${m.name || "이 사람"}을(를) 강퇴할까요?`, `${m.ip}의 이 방 연결을 끊습니다. 밴이 아니라서 다시 들어올 수 있습니다.`, "강퇴",
    () => act("/api/kick", { pair: m.pair, ip: m.ip, name: m.name, room: room?.id }, "강퇴했습니다"));
}
function banBox(ip, name) {
  let days = 1;
  dialog(`<h4>밴</h4><p><b>${esc(name || "(이름 없음)")}</b> · <span class="mono">${esc(ip)}</span><br>이 IP의 연결을 모두 끊고, 기간 동안 방 목록·방 만들기·입장을 모두 막습니다.
      같은 공유기나 모바일 데이터를 쓰는 다른 사람도 같이 막힐 수 있습니다.</p>
    <label>기간</label><div class="seg"><button data-d="1" class="on">1일</button><button data-d="7">7일</button><button data-d="0">영구</button></div>
    <label>사유 (기록에 남음)</label><textarea maxlength="200" placeholder="예: 치트 사용 신고 (디시 ○월 ○일)"></textarea>
    <div class="foot"><button class="btn" data-x>취소</button><button class="btn solid-danger" data-ok>밴</button></div>`,
    (sc, close) => {
      for (const b of sc.querySelectorAll(".seg button")) b.onclick = () => { days = +b.dataset.d; for (const x of sc.querySelectorAll(".seg button")) x.classList.toggle("on", x === b); };
      sc.querySelector("[data-x]").onclick = close;
      sc.querySelector("textarea").focus();
      sc.querySelector("[data-ok]").onclick = () => {
        const reason = sc.querySelector("textarea").value.trim(); close();
        act("/api/ban", { ip, name, reason, days }, `밴했습니다 (${days ? days + "일" : "영구"})`);
      };
    });
}
function unbanBox(b) {
  confirmBox(`${b.ip} 밴을 풀까요?`, `${b.name || "(이름 없음)"} · ${b.reason || "사유 없음"}`, "해제",
    () => act("/api/unban", { ip: b.ip, name: b.name }, "밴을 풀었습니다"));
}

function left(until) {
  if (!until) return "영구";
  const s = Math.max(0, (new Date(until).getTime() - Date.now() - skew) / 1000);
  return s < 3600 ? Math.ceil(s / 60) + "분 남음" : s < 86400 ? Math.floor(s / 3600) + "시간 남음" : Math.floor(s / 86400) + "일 " + Math.floor((s % 86400) / 3600) + "시간 남음";
}
function when(t) { return new Date(t).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }); }

function renderBans() {
  const box = $("#bans");
  const empty = box.querySelector(".empty");
  if (!state.bans.length) { if (!empty) box.insertAdjacentHTML("afterbegin", '<div class="empty">밴한 사람이 없습니다.</div>'); }
  else if (empty) empty.remove();
  sync(box, state.bans, (b) => b.ip + b.at, (b) => { const el = document.createElement("div"); el.className = "rowc"; fillBan(el, b); return el; }, fillBan);
}
function fillBan(el, b) {
  el.innerHTML = `<div><b>${esc(b.name || "(이름 없음)")}</b> <span class="mono">${esc(b.ip)}</span>
      <div class="m"><span class="badge b-key">${left(b.until)}</span><span>${when(b.at)} 밴</span><span>${esc(b.reason || "사유 없음")}</span></div></div>
    <button class="btn">해제</button>`;
  el.querySelector("button").onclick = () => unbanBox(b);
}

const logOpen = () => $("#v-log").classList.contains("on");
let logTimer = null;
async function loadLog() {
  try {
    const [joins, acts] = await Promise.all([api("/api/joins?q=" + encodeURIComponent($("#q").value)), api("/api/actions")]);
    const banned = new Set((state?.bans || []).map((b) => b.ip));
    $("#joins").innerHTML = joins.length ? joins.map((j, i) => `<div class="rowc"><div><b>${esc(j.name || "(이름 없음)")}</b>
        <span class="badge ${j.role === "host" ? "b-host" : "b-tcp"}">${j.role === "host" ? "방장" : "참가"}</span>
        <div class="m"><span>${when(j.at)}</span><button class="ip mono" data-i="${i}">${esc(j.ip)}</button><span>${j.role === "host" ? "방을 열었음" : esc(j.host) + "의 방"}</span></div></div>
        <button class="btn danger" data-b="${i}" ${banned.has(j.ip) ? "disabled" : ""}>${banned.has(j.ip) ? "밴됨" : "밴"}</button></div>`).join("")
      : '<div class="empty">최근 3일 동안 기록이 없습니다.</div>';
    for (const b of $("#joins").querySelectorAll("[data-b]")) b.onclick = () => { const j = joins[+b.dataset.b]; banBox(j.ip, j.name); };
    for (const b of $("#joins").querySelectorAll("[data-i]")) b.onclick = () => { const j = joins[+b.dataset.i]; navigator.clipboard?.writeText(j.ip).then(() => toast("IP 복사: " + j.ip), () => {}); };
    const kind = { kick: "강퇴", close: "방 닫기", ban: "밴", unban: "밴 해제" };
    $("#actions").innerHTML = acts.length ? acts.map((a) => `<div class="rowc"><div><b>${kind[a.kind] || esc(a.kind)}</b> ${esc(a.name || "")}
        <div class="m"><span>${when(a.at)}</span><span class="mono">${esc(a.target)}</span><span>${esc(a.reason || "")}</span><span>${esc(a.device || "")}</span></div></div></div>`).join("")
      : '<div class="empty">아직 관리 조치가 없습니다.</div>';
  } catch (e) { toast(e.message); }
}
$("#q").oninput = () => { clearTimeout(logTimer); logTimer = setTimeout(loadLog, 250); };

function renderServer() {
  const s = state.server;
  const items = [["방", state.rooms.length], ["중계 중인 플레이어", s.links], ["연결", s.conns], ["밴", state.bans.length],
    ["가동 시간", ago(s.started)], ["시작", new Date(s.started).toLocaleString("ko-KR")], ["버전", s.version]];
  $("#stats").innerHTML = items.map(([k, v]) => `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("");
}

function announce() {
  if (!prev) return;
  const old = new Map(prev.rooms.map((r) => [r.id, r]));
  for (const r of state.rooms) {
    const o = old.get(r.id);
    if (!o) { toast(`새 방: ${hostName(r)} (${r.keyed ? "매칭 키" : "공개"})`); continue; }
    const names = new Set(o.members.filter((m) => m.node > 0).map((m) => m.name));
    for (const m of r.members) if (m.node > 0 && !names.has(m.name)) toast(`${m.name} → ${hostName(r)}의 방`);
    old.delete(r.id);
  }
  for (const o of old.values()) if (o.id !== selected) toast(`방 닫힘: ${hostName(o)}`);
}

function render() {
  skew = new Date(state.server.now).getTime() - Date.now();
  $("#ver").textContent = state.server.version;
  setChip("#cRooms", state.rooms.length); setChip("#cLinks", state.server.links); setChip("#cConns", state.server.conns);
  $("#cUp").textContent = ago(state.server.started);
  announce(); renderRooms(); renderDetail(false); renderBans(); renderServer();
  if (logOpen()) { clearTimeout(logTimer); logTimer = setTimeout(loadLog, 600); }
  prev = state;
}

function live(on) {
  $("#live").className = "live " + (on ? "on" : "off");
  $("#liveText").textContent = on ? "실시간" : "끊김";
  $("#offbar").classList.toggle("show", !on);
}

let es = null, retry = 1000;
function connect() {
  es = new EventSource("/api/events");
  es.addEventListener("state", (e) => { live(true); retry = 1000; state = JSON.parse(e.data); render(); });
  es.onerror = () => { live(false); es.close(); setTimeout(connect, retry); retry = Math.min(retry * 2, 15000); };
}

for (const b of document.querySelectorAll("#tabs button")) {
  b.onclick = () => {
    for (const x of document.querySelectorAll("#tabs button")) x.classList.toggle("on", x === b);
    for (const v of document.querySelectorAll(".view")) v.classList.toggle("on", v.id === "v-" + b.dataset.v);
    if (b.dataset.v === "log") loadLog();
  };
}
setInterval(() => { if (state) { renderRooms(); renderServer(); $("#cUp").textContent = ago(state.server.started); if (selected) renderDetail(false); } }, 30000);
renderDetail(true);
connect();
</script>
</body>
</html>
